<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>Sign in</h1>
    <!--ERROR-->
    <form method="post" action="/login" data-testid="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" value="" data-testid="username-input">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" data-testid="password-input">

      <button type="submit" data-testid="login-button">Log in</button>
    </form>
    <p class="hint">Demo credentials: <code>admin</code> / <code>admin123</code></p>
  </main>
</body>
</html>
